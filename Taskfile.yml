# https://taskfile.dev

version: "3"

tasks:
  install:
    desc: Install Python and project dependencies with uv
    cmd: uv sync

  rdf2conf:
    desc: Generate the Apache PID configuration
    cmd: uv run python scripts/rdf2conf.py

  test:
    desc: Run the Python test suite
    cmd: uv run pytest

  aup:
    cmd: docker compose -f tests/apache/docker-compose.yml up -d

  adown:
    cmd: docker compose -f tests/apache/docker-compose.yml down
